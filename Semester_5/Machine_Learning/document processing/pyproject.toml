[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-field-verifier"
version = "1.0.0"
description = "End-to-End Invoice and Receipt Processing Pipeline with Field Verifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.2.0",
    "scikit-learn>=1.5.0",
    "imbalanced-learn>=0.12.0",
    "rapidfuzz>=3.9.0",
    "docling>=2.0.0",
    "ollama>=0.4.0",
    "gradio>=5.0.0",
    "datasets>=3.0.0",
    "imagehash>=4.3.0",
    "pyyaml>=6.0.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
