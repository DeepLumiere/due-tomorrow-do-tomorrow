# Project configuration
seed: 42

paths:
  cord_data_dir: "data/raw/cord"
  cache_dir: "data/cache"
  docling_cache_dir: "data/cache/docling"
  processed_dir: "data/processed"
  store_dir: "data/store"
  models_dir: "models"
  reports_dir: "reports"
  uploads_dir: "data/raw_uploads"

pipeline:
  ocr_engine: "rapidocr"
  docling_pipeline: "standard" # standard vs vlm
  llm_model: "gemma3:1b"
  llm_endpoint: "http://localhost:11434"
  llm_temperature: 0.0
  llm_num_ctx: 8192
  k_samples: 3 # for self-consistency ablation
  max_retries: 2
  prompt_path: "prompts/extract_v1.txt"

verifier:
  model_type: "hist_gradient_boosting" # logistic_regression, random_forest, hist_gradient_boosting
  confidence_threshold: 0.85 # selected on val split
  target_recall: 0.90 # min error recall target on val split
  model_path: "models/verifier_v1.joblib"
  metrics_path: "reports/metrics.json"

store:
  schema_version: "1.0"
