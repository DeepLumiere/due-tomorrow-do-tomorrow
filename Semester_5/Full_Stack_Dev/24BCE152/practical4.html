<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>SatSys - Satellite Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2vw;
            background-color: #fafafa;
        }

        .container {
            width: 90vw;
            max-width: 90vw;
            margin: 0 auto;
        }

        .page-title {
            font-size: 4vw;
            color: #2c3e50;
            margin-bottom: 0.5vw;
        }

        .subtitle {
            font-size: 1.5vw;
            color: #666;
            margin-top: 0;
            margin-bottom: 1.5vw;
        }

        .banner-img {
            width: 90vw;
            max-width: 90vw;
            height: 45vw;
            object-fit: fill;
            border-radius: 0.5vw;
            margin-bottom: 1.5vw;
        }

        .form-section, .actions-section, .geo-section {
            background-color: #fff;
            padding: 1.5vw;
            border: 0.1vw solid #ddd;
            border-radius: 0.5vw;
            margin-bottom: 1.5vw;
        }

        .drop-zone {
            border: 0.2vw dashed #3498db;
            padding: 1.5vw;
            text-align: center;
            background-color: #f7f9fa;
            border-radius: 0.5vw;
            font-size: 1.2vw;
            color: #555;
            margin-bottom: 1.5vw;
        }

        .drop-zone.dragover {
            background-color: #e3f2fd;
            border-color: #2196f3;
        }

        input, select, button {
            padding: 1vw;
            margin: 0.5vw;
            font-size: 1.2vw;
            box-sizing: border-box;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 90vw;
            max-width: 90vw;
            margin-top: 1vw;
            background-color: #fff;
        }

        th, td {
            border: 0.1vw solid #ccc;
            padding: 1vw;
            font-size: 1.2vw;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tbody tr {
            cursor: move;
        }

        .del-btn:hover { background-color: red; color: white; border-color: red; cursor: pointer; }
        .add-btn:hover { background-color: green; color: white; border-color: green; cursor: pointer; }
        .dwd-btn:hover { background-color: blue; color: white; border-color: blue; cursor: pointer; }
        .geo-btn:hover { background-color: orange; color: white; border-color: orange; cursor: pointer; }

        .status-done { background-color: #d4edda; color: #155724; }
        .status-inprogress { background-color: #cce5ff; color: #004085; }
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-missed { background-color: #e2e3e5; color: #383d41; }
        .status-crashed { background-color: #f8d7da; color: #721c24; }

        @media (max-width: 600px) {
            body {
                margin: 2vw;
            }

            .page-title {
                font-size: 6vw;
            }

            .subtitle {
                font-size: 2.5vw;
            }

            input, select, button, .drop-zone {
                width: 100%;
                font-size: 3vw;
                padding: 2vw;
                margin: 1vw 0;
            }

            th, td {
                font-size: 2.5vw;
                padding: 2vw;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h2 class="page-title">Sat Mgmt System</h2>
    <p class="subtitle">Responsive layout with Geolocation, Local Storage, and Drag & Drop</p>

    <div class="geo-section">
        <button class="geo-btn" onclick="getCoordinates()">Get My Location</button>
        <span id="geoDisplay" style="font-size: 1.2vw; margin-left: 1vw; color: #333;">Location: Not fetched yet</span>
    </div>

    <picture>
        <source media="(min-width: 600px)" srcset="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1472&auto=format&fit=crop">
        <img class="banner-img" src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1472&auto=format&fit=crop" alt="Deep Satellite Image">
    </picture>

    <div class="form-section">
        <input type="text" id="satInput" placeholder="Name">
        <input type="text" id="orgInput" placeholder="Organization">
        <input type="date" id="dateInput">
        <select id="statusInput">
            <option value="Pending">Pending</option>
            <option value="In Progress">Progress</option>
            <option value="Done">Done</option>
            <option value="Missed">Missed</option>
            <option value="Crashed">Crashed</option>
        </select>
        <button class="add-btn" onclick="addSatellite()">Add Satellite</button>
    </div>

    <div class="actions-section">
        <input type="text" id="searchInput" placeholder="Search Here" onkeyup="showSatellites()">
        <button class="dwd-btn" onclick="downloadJSON()">Download JSON</button>
        <input type="file" id="fileInput" onchange="uploadJSON(event)">
    </div>

    <div id="dropZone" class="drop-zone" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        Drag & Drop your satellite JSON file here to upload
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Org</th>
                <th>Launch Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="satTable"></tbody>
        </table>
    </div>
</div>

<script>
    let satellites = JSON.parse(localStorage.getItem("satellites")) || [
        { id: 1, name: "GoSa", org: "Deep", launchDate: "2026-05-10", status: "Done" },
        { id: 2, name: "MoSa", org: "Nirma", launchDate: "2026-08-15", status: "In Progress" },
        { id: 3, name: "DoSa", org: "Nasa", launchDate: "2026-12-01", status: "Pending" },
        { id: 4, name: "LoSa", org: "Isro", launchDate: "2026-11-20", status: "Crashed" }
    ];

    function saveToLocalStorage() {
        localStorage.setItem("satellites", JSON.stringify(satellites));
    }

    function getCoordinates() {
        let display = document.getElementById("geoDisplay");
        if (navigator.geolocation) {
            display.innerText = "Locating...";
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    let lat = position.coords.latitude.toFixed(4);
                    let lon = position.coords.longitude.toFixed(4);
                    display.innerText = `Latitude: ${lat}, Longitude: ${lon}`;
                },
                function (error) {
                    display.innerText = "Error: Unable to retrieve your location.";
                }
            );
        } else {
            display.innerText = "Geolocation is not supported by your browser.";
        }
    }

    let dragIndex;

    function dragStart(event, index) {
        dragIndex = index;
        event.dataTransfer.setData("text/plain", index);
    }

    function dragOver(event) {
        event.preventDefault();
    }

    function dragDrop(event, index) {
        event.preventDefault();
        let draggedItem = satellites.splice(dragIndex, 1)[0];
        satellites.splice(index, 0, draggedItem);
        saveToLocalStorage();
        showSatellites();
    }

    function handleDragOver(event) {
        event.preventDefault();
        document.getElementById("dropZone").classList.add("dragover");
    }

    function handleDragLeave(event) {
        event.preventDefault();
        document.getElementById("dropZone").classList.remove("dragover");
    }

    function handleDrop(event) {
        event.preventDefault();
        document.getElementById("dropZone").classList.remove("dragover");
        let files = event.dataTransfer.files;
        if (files.length > 0) {
            let reader = new FileReader();
            reader.onload = function (e) {
                try {
                    satellites = JSON.parse(e.target.result);
                    saveToLocalStorage();
                    showSatellites();
                    alert("Satellites successfully imported via Drag & Drop!");
                } catch (err) {
                    alert("Invalid JSON file format.");
                }
            };
            reader.readAsText(files[0]);
        }
    }

    function getStatusClass(status) {
        if (status === "Done") return "status-done";
        if (status === "In Progress") return "status-inprogress";
        if (status === "Pending") return "status-pending";
        if (status === "Missed") return "status-missed";
        if (status === "Crashed") return "status-crashed";
        return "";
    }

    function showSatellites() {
        let tbody = document.getElementById("satTable");
        tbody.innerHTML = "";

        let search = document.getElementById("searchInput").value.toLowerCase();

        satellites.forEach((sat, index) => {
            let nameMatch = sat.name.toLowerCase().includes(search);
            let orgMatch = (sat.org || "").toLowerCase().includes(search);
            let statusMatch = (sat.status || "").toLowerCase().includes(search);

            if (nameMatch || orgMatch || statusMatch) {
                let statusClass = getStatusClass(sat.status);
                tbody.innerHTML += `
                        <tr draggable="true" ondragstart="dragStart(event, ${index})" ondragover="dragOver(event)" ondrop="dragDrop(event, ${index})">
                            <td>${sat.id}</td>
                            <td>${sat.name}</td>
                            <td>${sat.org || '-'}</td>
                            <td>${sat.launchDate || '-'}</td>
                            <td>
                                <select class="${statusClass}" onchange="changeStatus(${index}, this.value)">
                                    <option value="Pending" ${sat.status === "Pending" ? "selected" : ""}>Pending</option>
                                    <option value="In Progress" ${sat.status === "In Progress" ? "selected" : ""}>In Progress</option>
                                    <option value="Done" ${sat.status === "Done" ? "selected" : ""}>Done</option>
                                    <option value="Missed" ${sat.status === "Missed" ? "selected" : ""}>Missed</option>
                                    <option value="Crashed" ${sat.status === "Crashed" ? "selected" : ""}>Crashed</option>
                                </select>
                            </td>
                            <td><button class="del-btn" onclick="deleteSat(${index})">Delete</button></td>
                        </tr>
                    `;
            }
        });
    }

    function addSatellite() {
        let nameInput = document.getElementById("satInput");
        let orgInput = document.getElementById("orgInput");
        let dateInput = document.getElementById("dateInput");
        let statusInput = document.getElementById("statusInput");

        if (nameInput.value !== "") {
            let newId = satellites.length > 0 ? satellites[satellites.length - 1].id + 1 : 1;
            satellites.push({
                id: newId,
                name: nameInput.value,
                org: orgInput.value || "Deep",
                launchDate: dateInput.value || "2026-06-06",
                status: statusInput.value
            });

            saveToLocalStorage();

            nameInput.value = "";
            orgInput.value = "";
            dateInput.value = "";
            statusInput.value = "Done";
            showSatellites();
        }
    }

    function changeStatus(index, newStatus) {
        satellites[index].status = newStatus;
        saveToLocalStorage();
        showSatellites();
    }

    function deleteSat(index) {
        satellites.splice(index, 1);
        saveToLocalStorage();
        showSatellites();
    }

    function downloadJSON() {
        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(satellites, null, 2));
        let a = document.createElement("a");
        a.href = dataStr;
        a.download = "sat.json";
        a.click();
    }

    function uploadJSON(event) {
        let reader = new FileReader();
        reader.onload = function (e) {
            satellites = JSON.parse(e.target.result);
            saveToLocalStorage();
            showSatellites();
        };
        reader.readAsText(event.target.files[0]);
    }

    showSatellites();
</script>
</body>

</html>
